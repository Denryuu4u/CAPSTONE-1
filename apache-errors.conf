# Friendly error pages for the Railway container (docroot = /var/www/html, so the
# app lives at "/"). Routes Apache's raw 404/403/500 pages to the app's branded
# error.php instead. Copied into /etc/apache2/conf-enabled/ by the Dockerfile.
ErrorDocument 400 /error.php
ErrorDocument 403 /error.php
ErrorDocument 404 /error.php
ErrorDocument 500 /error.php

<IfModule php_module>
    php_flag display_errors Off
    php_flag display_startup_errors Off
    php_flag log_errors On
</IfModule>

# Never serve the local-testing OTP log, even if a stale copy ends up on the
# uploads volume — its codes could be used to reset any account's password.
<Files "otp_log.txt">
    Require all denied
</Files>

# Backups contain private customer data and are downloaded through PHP only.
<Directory "/var/www/html/uploads/.system-backups">
    Require all denied
</Directory>

<Directory "/var/www/html/uploads/project-designs">
    Require all denied
</Directory>
